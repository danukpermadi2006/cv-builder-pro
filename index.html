<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern CV Builder PRO</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/docx@8.2.3/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: 'var(--color-primary)' },
                    fontFamily: {
                        'jakarta': ['Plus Jakarta Sans', 'sans-serif'],
                        'inter': ['Inter', 'sans-serif'],
                        'poppins': ['Poppins', 'sans-serif'],
                        'lora': ['Lora', 'serif'],
                        'mono': ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --color-primary: #10b981; /* Default Emerald */
            --font-main: 'Inter', sans-serif;
        }

        /* Base Cyberpunk/Dark Glass Theme */
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #030305;
            background-image: 
                radial-gradient(circle at 15% 0%, rgba(16, 185, 129, 0.15) 0%, transparent 35%),
                radial-gradient(circle at 85% 100%, rgba(20, 184, 166, 0.12) 0%, transparent 35%);
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
        }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .glass-panel {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.85), rgba(9, 9, 11, 0.95));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-color: rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .input-dark {
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(51, 65, 85, 0.6);
            color: #f8fafc;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            font-size: 13px !important;
        }
        
        .input-dark:hover {
            border-color: rgba(16, 185, 129, 0.4);
            background-color: rgba(0, 0, 0, 0.7);
        }
        
        .input-dark:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2), inset 0 2px 4px rgba(0,0,0,0.5);
            outline: none;
        }

        /* Compact Tabs Grid for No-Scroll Mobile View */
        .tab-btn {
            transition: all 0.2s ease;
            user-select: none;
        }
        .tab-btn.active {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.2), inset 0 0 8px rgba(16, 185, 129, 0.1);
        }

        .btn-action {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #10b981 0%, #0d9488 100%);
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.35);
        }
        .btn-action:hover {
            box-shadow: 0 6px 24px rgba(16, 185, 129, 0.6);
            transform: translateY(-1px);
        }

        /* CV Document Rendering Styles */
        .cv-page {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        
        .cv-template { width: 100%; height: 100%; color: #1e293b; line-height: 1.5; font-family: var(--font-main); }
        .cv-template h1, .cv-template h2, .cv-template h3 { color: var(--color-primary); }
        
        .fade-in { animation: fadeIn 0.25s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        
        #toast-container { position: fixed; bottom: 85px; right: 16px; z-index: 99999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        @media (min-width: 768px) { #toast-container { bottom: 20px; } }
        .toast { padding: 10px 16px; border-radius: 8px; color: white; font-weight: 500; font-size: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); transform: translateX(120%); transition: transform 0.3s ease-out; backdrop-filter: blur(10px); }
        .toast.show { transform: translateX(0); }
        .toast.success { background: rgba(16, 185, 129, 0.95); border: 1px solid #10b981; }
        .toast.error { background: rgba(239, 68, 68, 0.95); border: 1px solid #ef4444; }
        .toast.info { background: rgba(14, 165, 233, 0.95); border: 1px solid #0ea5e9; }
    </style>
</head>

<body class="min-h-screen h-[100dvh] flex flex-col overflow-hidden bg-[#030305] text-slate-100">

    <!-- Header Glassmorphism -->
    <header class="glass-panel border-b px-3 py-2 md:px-5 md:py-3.5 flex justify-between items-center z-30 shrink-0">
        <div class="flex items-center gap-2.5">
            <!-- Logo Foto Profil di Pojok Kiri Atas -->
            <div class="relative group flex items-center justify-center w-9 h-9 md:w-11 md:h-11 rounded-lg md:rounded-xl bg-slate-900 border border-emerald-500/40 overflow-hidden shrink-0 shadow-lg">
                <div class="absolute inset-0 bg-gradient-to-tr from-emerald-500 to-teal-400 opacity-20 group-hover:opacity-40 transition-opacity"></div>
                <img src="danuk.jpg" alt="Logo Danuk" onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');" class="absolute inset-0 w-full h-full object-cover">
                <i class="fa-solid fa-file-invoice text-emerald-400 text-sm md:text-lg relative z-10 hidden"></i>
            </div>
            <div>
                <h1 class="text-sm md:text-lg font-extrabold tracking-tight text-white leading-tight">
                    CV <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-400">Builder</span>
                </h1>
                <p class="text-slate-400 text-[9px] md:text-xs font-medium">PRO Edition</p>
            </div>
        </div>
        
        <!-- Header Actions: Dummy, Reset, and Export -->
        <div class="flex items-center gap-1.5 md:gap-3">
            <button onclick="loadDummyData()" title="Muat Data Dummy" class="p-2 md:px-3 md:py-1.5 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/80 rounded-lg text-slate-300 transition flex items-center gap-1.5 text-xs">
                <i class="fa-solid fa-magic text-emerald-400 text-xs"></i> 
                <span class="hidden md:inline font-semibold text-xs">Demo</span>
            </button>
            <button onclick="clearData()" title="Reset CV" class="p-2 md:px-3 md:py-1.5 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 rounded-lg text-rose-400 transition flex items-center gap-1.5 text-xs">
                <i class="fa-solid fa-trash-alt text-xs"></i> 
                <span class="hidden md:inline font-semibold text-xs">Reset</span>
            </button>
            
            <div class="h-5 w-px bg-slate-800 mx-0.5 hidden sm:block"></div>
            
            <!-- Export Dropdown -->
            <div class="relative group">
                <button class="btn-action text-white text-xs md:text-sm px-2.5 md:px-4 py-2 md:py-2 rounded-lg font-bold flex items-center gap-1.5 md:gap-2">
                    <i class="fa-solid fa-download text-xs"></i> <span>Export</span>
                </button>
                <div class="absolute right-0 mt-2 w-44 bg-[#0a0a0e] rounded-xl shadow-[0_10px_35px_rgba(0,0,0,0.85)] border border-emerald-500/30 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 overflow-hidden">
                    <div class="py-1 divide-y divide-white/5 text-xs">
                        <button onclick="exportCV('pdf')" class="w-full text-left px-3 py-2 text-slate-300 hover:bg-emerald-500/20 hover:text-white flex items-center gap-2.5"><i class="fa-solid fa-file-pdf text-rose-400 w-4"></i> PDF Document</button>
                        <button onclick="exportCV('docx')" class="w-full text-left px-3 py-2 text-slate-300 hover:bg-emerald-500/20 hover:text-white flex items-center gap-2.5"><i class="fa-solid fa-file-word text-blue-400 w-4"></i> Word (DOCX)</button>
                        <button onclick="exportCV('png')" class="w-full text-left px-3 py-2 text-slate-300 hover:bg-emerald-500/20 hover:text-white flex items-center gap-2.5"><i class="fa-solid fa-image text-emerald-400 w-4"></i> Image (PNG)</button>
                        <button onclick="exportCV('html')" class="w-full text-left px-3 py-2 text-slate-300 hover:bg-emerald-500/20 hover:text-white flex items-center gap-2.5"><i class="fa-brands fa-html5 text-orange-400 w-4"></i> Web HTML</button>
                        <button onclick="exportCV('txt')" class="w-full text-left px-3 py-2 text-slate-300 hover:bg-emerald-500/20 hover:text-white flex items-center gap-2.5"><i class="fa-solid fa-file-lines text-slate-400 w-4"></i> Plain Text</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Left Panel: Form Editor -->
        <div class="w-full md:w-[45%] lg:w-[40%] flex flex-col glass-panel z-10 h-full relative border-r border-white/5">
            
            <!-- Compact Navigation Grid: Terlihat semua di mobile TANPA scroll! -->
            <div class="p-2 border-b border-white/5 bg-black/40 shrink-0">
                <div class="grid grid-cols-6 sm:grid-cols-6 gap-1 md:gap-1.5" id="tab-nav-container">
                    <button onclick="switchTab('design')" data-target="design" class="tab-btn active flex flex-col items-center justify-center py-1.5 px-0.5 rounded-lg border border-slate-700/60 bg-slate-900/40 text-slate-400 hover:text-slate-200">
                        <i class="fa-solid fa-palette text-xs mb-0.5"></i>
                        <span class="text-[9px] md:text-[11px] font-semibold truncate leading-tight">Design</span>
                    </button>
                    <button onclick="switchTab('personal')" data-target="personal" class="tab-btn flex flex-col items-center justify-center py-1.5 px-0.5 rounded-lg border border-slate-700/60 bg-slate-900/40 text-slate-400 hover:text-slate-200">
                        <i class="fa-solid fa-user text-xs mb-0.5"></i>
                        <span class="text-[9px] md:text-[11px] font-semibold truncate leading-tight">Profil</span>
                    </button>
                    <button onclick="switchTab('experience')" data-target="experience" class="tab-btn flex flex-col items-center justify-center py-1.5 px-0.5 rounded-lg border border-slate-700/60 bg-slate-900/40 text-slate-400 hover:text-slate-200">
                        <i class="fa-solid fa-briefcase text-xs mb-0.5"></i>
                        <span class="text-[9px] md:text-[11px] font-semibold truncate leading-tight">Kerja</span>
                    </button>
                    <button onclick="switchTab('education')" data-target="education" class="tab-btn flex flex-col items-center justify-center py-1.5 px-0.5 rounded-lg border border-slate-700/60 bg-slate-900/40 text-slate-400 hover:text-slate-200">
                        <i class="fa-solid fa-graduation-cap text-xs mb-0.5"></i>
                        <span class="text-[9px] md:text-[11px] font-semibold truncate leading-tight">Didik</span>
                    </button>
                    <button onclick="switchTab('skills')" data-target="skills" class="tab-btn flex flex-col items-center justify-center py-1.5 px-0.5 rounded-lg border border-slate-700/60 bg-slate-900/40 text-slate-400 hover:text-slate-200">
                        <i class="fa-solid fa-star text-xs mb-0.5"></i>
                        <span class="text-[9px] md:text-[11px] font-semibold truncate leading-tight">Skill</span>
                    </button>
                    <button onclick="switchTab('projects')" data-target="projects" class="tab-btn flex flex-col items-center justify-center py-1.5 px-0.5 rounded-lg border border-slate-700/60 bg-slate-900/40 text-slate-400 hover:text-slate-200">
                        <i class="fa-solid fa-award text-xs mb-0.5"></i>
                        <span class="text-[9px] md:text-[11px] font-semibold truncate leading-tight">Extra</span>
                    </button>
                </div>
            </div>

            <!-- Form Content Area (Scrollable vertikal dengan padding bawah aman) -->
            <div id="form-container" class="flex-1 overflow-y-auto p-3 md:p-5 custom-scrollbar pb-28 md:pb-6 relative z-10">
                
                <div id="section-design" class="form-section fade-in">
                    <h2 class="text-sm md:text-base font-bold text-white mb-2.5 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-emerald-400"></i> Pengaturan Visual
                    </h2>
                    
                    <div class="space-y-3.5">
                        <div>
                            <label class="block text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Template CV</label>
                            <!-- 2 Kolom di mobile agar muat rapi dan hemat tempat -->
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="updateState('template', 'modern')" class="template-btn bg-slate-900/50 border border-slate-700/80 rounded-lg p-2 md:p-3 text-left hover:border-emerald-500/50 transition relative overflow-hidden group">
                                    <div class="font-bold text-slate-200 text-xs md:text-sm">Modern</div>
                                    <div class="text-[9px] md:text-[10px] text-slate-400 mt-0.5">Kolom ganda elegan</div>
                                </button>
                                <button onclick="updateState('template', 'classic')" class="template-btn bg-slate-900/50 border border-slate-700/80 rounded-lg p-2 md:p-3 text-left hover:border-emerald-500/50 transition relative overflow-hidden group">
                                    <div class="font-bold text-slate-200 text-xs md:text-sm">Classic</div>
                                    <div class="text-[9px] md:text-[10px] text-slate-400 mt-0.5">Formal, garis tegas</div>
                                </button>
                                <button onclick="updateState('template', 'creative')" class="template-btn bg-slate-900/50 border border-slate-700/80 rounded-lg p-2 md:p-3 text-left hover:border-emerald-500/50 transition relative overflow-hidden group">
                                    <div class="font-bold text-slate-200 text-xs md:text-sm">Creative</div>
                                    <div class="text-[9px] md:text-[10px] text-slate-400 mt-0.5">Warna tegas ekspresif</div>
                                </button>
                                <button onclick="updateState('template', 'minimalist')" class="template-btn bg-slate-900/50 border border-slate-700/80 rounded-lg p-2 md:p-3 text-left hover:border-emerald-500/50 transition relative overflow-hidden group">
                                    <div class="font-bold text-slate-200 text-xs md:text-sm">Minimalist</div>
                                    <div class="text-[9px] md:text-[10px] text-slate-400 mt-0.5">Bersih spasi luas</div>
                                </button>
                                <button onclick="updateState('template', 'ats')" class="template-btn bg-emerald-950/25 border border-emerald-800/60 rounded-lg p-2 md:p-3 text-left hover:border-emerald-500 transition relative overflow-hidden group col-span-2">
                                    <div class="font-bold text-emerald-400 text-xs md:text-sm flex items-center justify-between">
                                        <span>ATS-Friendly</span>
                                        <i class="fa-solid fa-robot text-xs"></i>
                                    </div>
                                    <div class="text-[9px] md:text-[10px] text-emerald-500/80 mt-0.5">Standar screening rekrutmen. Format teks mudah dipindai bot.</div>
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 border-t border-slate-800 pt-3">
                            <div class="group">
                                <label class="block text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Aksen Warna</label>
                                <div class="flex items-center gap-2 bg-slate-900/50 border border-slate-700 p-1.5 rounded-lg">
                                    <input type="color" id="color-picker" value="#10b981" class="w-6 h-6 rounded cursor-pointer border-0 p-0 bg-transparent shrink-0" onchange="updateState('color', this.value)">
                                    <span class="text-[10px] md:text-xs font-mono font-medium text-slate-300" id="color-hex">#10B981</span>
                                </div>
                            </div>
                            <div class="group">
                                <label class="block text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Jenis Font</label>
                                <div class="relative">
                                    <select onchange="updateState('font', this.value)" class="w-full p-2 input-dark rounded-lg appearance-none font-medium text-[11px] md:text-xs">
                                        <option value="inter">Inter (Modern)</option>
                                        <option value="jakarta">Plus Jakarta</option>
                                        <option value="poppins">Poppins</option>
                                        <option value="lora">Lora (Serif)</option>
                                        <option value="mono">Roboto Mono</option>
                                    </select>
                                    <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500 text-[10px] pointer-events-none"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="section-personal" class="form-section hidden fade-in">
                    <h2 class="text-sm md:text-base font-bold text-white mb-2.5 flex items-center gap-2">
                        <i class="fa-solid fa-address-card text-emerald-400"></i> Informasi Pribadi
                    </h2>
                    
                    <div class="bg-black/30 border border-slate-700/60 p-2.5 md:p-3 rounded-lg mb-3 flex items-center gap-3 relative overflow-hidden">
                        <div class="absolute left-0 top-0 w-1 h-full bg-emerald-500"></div>
                        <div class="w-14 h-14 md:w-16 md:h-16 bg-slate-800 rounded-full overflow-hidden flex items-center justify-center shrink-0 border border-slate-600 relative group cursor-pointer shadow-inner">
                            <img id="photo-preview" src="https://placehold.co/150x150/1e293b/94a3b8?text=Foto" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                <i class="fa-solid fa-camera text-white text-sm"></i>
                            </div>
                            <input type="file" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="handlePhotoUpload(event)">
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs md:text-sm font-bold text-slate-200">Foto Profil (Opsional)</p>
                            <p class="text-[9px] text-slate-400 mt-0.5 leading-tight">Ketuk foto untuk ganti (otomatis disembunyikan di template ATS).</p>
                            <button onclick="removePhoto()" class="text-[9px] text-rose-400 mt-1 hover:text-rose-300 font-medium bg-rose-500/10 px-2 py-0.5 rounded border border-rose-500/20"><i class="fa-solid fa-trash-can mr-1"></i> Hapus Foto</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        <div class="group">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Nama Lengkap</label>
                            <input type="text" data-field="personal.name" oninput="handleInput(event)" class="form-input w-full p-2 input-dark rounded-lg text-xs" placeholder="Budi Santoso">
                        </div>
                        <div class="group">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Jabatan / Role</label>
                            <input type="text" data-field="personal.title" oninput="handleInput(event)" class="form-input w-full p-2 input-dark rounded-lg text-xs" placeholder="Frontend Developer">
                        </div>
                        <div class="group">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Email</label>
                            <input type="email" data-field="personal.email" oninput="handleInput(event)" class="form-input w-full p-2 input-dark rounded-lg text-xs" placeholder="budi@example.com">
                        </div>
                        <div class="group">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">No. WhatsApp / HP</label>
                            <input type="tel" data-field="personal.phone" oninput="handleInput(event)" class="form-input w-full p-2 input-dark rounded-lg text-xs" placeholder="+62 812-3456-7890">
                        </div>
                        <div class="col-span-1 sm:col-span-2 group">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Domisili (Kota, Negara)</label>
                            <input type="text" data-field="personal.location" oninput="handleInput(event)" class="form-input w-full p-2 input-dark rounded-lg text-xs" placeholder="Jakarta, Indonesia">
                        </div>
                        <div class="group">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">LinkedIn (Opsional)</label>
                            <input type="text" data-field="personal.linkedin" oninput="handleInput(event)" class="form-input w-full p-2 input-dark rounded-lg text-xs" placeholder="linkedin.com/in/user">
                        </div>
                        <div class="group">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Portofolio / Web</label>
                            <input type="text" data-field="personal.website" oninput="handleInput(event)" class="form-input w-full p-2 input-dark rounded-lg text-xs" placeholder="github.com/user">
                        </div>
                        <div class="col-span-1 sm:col-span-2 group">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Ringkasan Profil</label>
                            <textarea data-field="personal.summary" oninput="handleInput(event)" rows="3" class="form-input w-full p-2 input-dark rounded-lg resize-none text-xs leading-normal" placeholder="Tuliskan 3-4 kalimat ringkas mengenai keahlian dan pencapaian profesional Anda..."></textarea>
                        </div>
                    </div>
                </div>

                <div id="section-experience" class="form-section hidden fade-in">
                    <div class="flex justify-between items-center mb-2.5 border-b border-slate-800 pb-2">
                        <h2 class="text-sm md:text-base font-bold text-white flex items-center gap-1.5"><i class="fa-solid fa-briefcase text-emerald-400"></i> Pengalaman Kerja</h2>
                        <button onclick="addListItem('experience')" class="text-[10px] md:text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded hover:bg-emerald-500/30 transition font-bold"><i class="fa-solid fa-plus mr-1"></i>Tambah</button>
                    </div>
                    <div id="experience-list" class="space-y-2.5"></div>
                </div>

                <div id="section-education" class="form-section hidden fade-in">
                    <div class="flex justify-between items-center mb-2.5 border-b border-slate-800 pb-2">
                        <h2 class="text-sm md:text-base font-bold text-white flex items-center gap-1.5"><i class="fa-solid fa-graduation-cap text-emerald-400"></i> Pendidikan</h2>
                        <button onclick="addListItem('education')" class="text-[10px] md:text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded hover:bg-emerald-500/30 transition font-bold"><i class="fa-solid fa-plus mr-1"></i>Tambah</button>
                    </div>
                    <div id="education-list" class="space-y-2.5"></div>
                </div>

                <div id="section-skills" class="form-section hidden fade-in">
                    <div class="flex justify-between items-center mb-2 bg-slate-900/50 p-2 rounded-lg border border-slate-800">
                        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider"><i class="fa-solid fa-bolt text-emerald-400 mr-1.5"></i>Hard Skills</h3>
                        <button onclick="addListItem('skills')" class="text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/30 hover:bg-emerald-500/20 transition"><i class="fa-solid fa-plus"></i> Tambah</button>
                    </div>
                    <div id="skills-list" class="space-y-2 mb-4"></div>

                    <div class="flex justify-between items-center mb-2 bg-slate-900/50 p-2 rounded-lg border border-slate-800">
                        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider"><i class="fa-solid fa-language text-emerald-400 mr-1.5"></i>Bahasa</h3>
                        <button onclick="addListItem('languages')" class="text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/30 hover:bg-emerald-500/20 transition"><i class="fa-solid fa-plus"></i> Tambah</button>
                    </div>
                    <div id="languages-list" class="space-y-2"></div>
                </div>

                <div id="section-projects" class="form-section hidden fade-in">
                    <div class="flex justify-between items-center mb-2.5 border-b border-slate-800 pb-2">
                        <h2 class="text-sm md:text-base font-bold text-white flex items-center gap-1.5"><i class="fa-solid fa-award text-emerald-400"></i> Sertifikasi & Ekstra</h2>
                        <button onclick="addListItem('certifications')" class="text-[10px] md:text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded hover:bg-emerald-500/30 transition font-bold"><i class="fa-solid fa-plus mr-1"></i>Tambah</button>
                    </div>
                    <div id="certifications-list" class="space-y-2.5"></div>
                </div>
            </div>
        </div>

        <div id="preview-panel" class="hidden md:flex fixed md:relative inset-0 md:inset-auto w-full md:w-[55%] lg:w-[60%] bg-[#06080d] md:bg-black/25 overflow-y-auto flex-col items-center py-0 md:py-6 z-[100] md:z-10 shadow-inner custom-scrollbar transition-opacity duration-300">
            
            <!-- Mobile Sticky Header for Preview Modal -->
            <div class="md:hidden sticky top-0 w-full flex justify-between items-center px-4 py-2.5 z-[110] bg-slate-900/95 backdrop-blur border-b border-white/10 shadow-lg">
                <span class="text-white font-bold text-xs tracking-wider uppercase flex items-center gap-1.5">
                    <i class="fa-solid fa-eye text-emerald-400"></i> Live Preview A4
                </span>
                <button onclick="toggleMobilePreview()" class="w-8 h-8 bg-rose-500/20 text-rose-400 rounded-lg flex items-center justify-center hover:bg-rose-500/30 transition">
                    <i class="fa-solid fa-times text-base"></i>
                </button>
            </div>

            <div class="text-slate-400 text-[10px] md:text-xs my-3 md:mb-4 font-bold tracking-widest uppercase px-3 py-1 rounded-full bg-black/60 border border-slate-800 shadow-sm inline-block">
                A4 Document (210 x 297 mm)
            </div>

            <!-- Dynamic Scale Container -->
            <div id="scale-container" class="w-full flex justify-center pb-20 md:pb-10 px-2 md:px-0">
                <div id="preview-wrapper" class="origin-top shadow-[0_20px_50px_rgba(0,0,0,0.85)] border border-slate-700/60 bg-white">
                    <div id="preview-content" class="cv-page">
                        <!-- Dynamic CV HTML Injection -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="md:hidden fixed bottom-0 left-0 right-0 p-2.5 bg-slate-950/95 backdrop-blur-xl border-t border-white/10 z-[80] pb-[calc(0.6rem+env(safe-area-inset-bottom))] shadow-[0_-10px_25px_rgba(0,0,0,0.7)]">
        <button onclick="toggleMobilePreview()" class="w-full btn-action text-white py-2.5 rounded-lg font-bold shadow-lg flex items-center justify-center gap-2 text-xs tracking-wide">
            <i class="fa-solid fa-eye text-emerald-300"></i> Tampilkan Preview CV
        </button>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container"></div>

    <script>
        const emptyState = {
            settings: { theme: 'light', color: '#10B981', font: 'inter', template: 'modern' },
            personal: { name: '', title: '', email: '', phone: '', location: '', linkedin: '', website: '', summary: '', photo: '' },
            experience: [], education: [], skills: [], languages: [], certifications: []
        };

        const dummyData = {
            settings: { theme: 'light', color: '#10B981', font: 'inter', template: 'modern' },
            personal: { 
                name: 'Danuk Permadi', 
                title: 'Fullstack Web Developer', 
                email: 'danuk.permadi@example.com', 
                phone: '+62 851-2976-9015', 
                location: 'Semarang, Indonesia', 
                linkedin: 'linkedin.com/in/danukpermadi', 
                website: 'github.com/danukpermadi2006', 
                summary: 'Software developer yang berfokus pada pembangunan aplikasi web responsif dan otomatisasi CI/CD. Memiliki pengalaman mengintegrasikan API pihak ketiga seperti Vercel dan GitHub.',
                photo: 'danuk.jpg'
            },
            experience: [
                { id: 1, company: 'Tech Solusindo', position: 'Frontend Developer', startDate: '2023', endDate: 'Sekarang', description: '• Membangun sistem deployment otomatis dari web ke cloud Vercel.\n• Meningkatkan kepuasan klien hingga 35% lewat UI yang bersih.' },
                { id: 2, company: 'Digital Inovasi', position: 'Web Developer Intern', startDate: '2022', endDate: '2023', description: '• Mengembangkan komponen antarmuka responsif menggunakan Tailwind CSS.' }
            ],
            education: [
                { id: 1, institution: 'SMK / Universitas Informatika', degree: 'Teknik Komputer & Jaringan', startDate: '2019', endDate: '2022', description: 'Fokus pada pemrograman web dan konfigurasi jaringan.' }
            ],
            skills: [
                { id: 1, name: 'HTML / CSS / JavaScript', level: 90 },
                { id: 2, name: 'Tailwind CSS', level: 85 },
                { id: 3, name: 'REST API & Cloud Deploy', level: 80 }
            ],
            languages: [
                { id: 1, name: 'Bahasa Indonesia', level: 'Native' },
                { id: 2, name: 'English', level: 'Conversational' }
            ],
            certifications: [
                { id: 1, title: 'Web Development Certification', issuer: 'Dicoding Academy', year: '2023' }
            ]
        };

        let cvState = JSON.parse(localStorage.getItem('cvStateProV3')) || JSON.parse(JSON.stringify(dummyData));
        let debounceTimer;

        document.addEventListener('DOMContentLoaded', () => {
            applySettings();
            renderAllForms();
            renderPreview();
            
            window.addEventListener('resize', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(adjustPreviewScale, 60);
            });
            
            setTimeout(adjustPreviewScale, 150);
            setInterval(() => localStorage.setItem('cvStateProV3', JSON.stringify(cvState)), 4000);
        });

        function updateState(field, value, noRender = false) {
            if (field.includes('.')) {
                const parts = field.split('.');
                cvState[parts[0]][parts[1]] = value;
            } else if (['template', 'color', 'font'].includes(field)) {
                cvState.settings[field] = value;
                applySettings();
            } else {
                cvState[field] = value;
            }
            
            if (!noRender) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(renderPreview, 150);
            }
        }

        function handleInput(event) {
            const field = event.target.getAttribute('data-field');
            if (field) updateState(field, event.target.value);
        }

        function loadDummyData() {
            cvState = JSON.parse(JSON.stringify(dummyData));
            applySettings();
            renderAllForms();
            renderPreview();
            showToast('Data contoh berhasil dimuat', 'success');
        }

        function clearData() {
            cvState = JSON.parse(JSON.stringify(emptyState));
            localStorage.removeItem('cvStateProV3');
            applySettings();
            renderAllForms();
            renderPreview();
            showToast('Formulir berhasil direset', 'info');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const targetBtn = document.querySelector(`.tab-btn[data-target="${tabId}"]`);
            if (targetBtn) targetBtn.classList.add('active');

            document.querySelectorAll('.form-section').forEach(sec => sec.classList.add('hidden'));
            const targetSec = document.getElementById(`section-${tabId}`);
            if (targetSec) targetSec.classList.remove('hidden');
        }

        function toggleMobilePreview() {
            const panel = document.getElementById('preview-panel');
            panel.classList.toggle('hidden');
            
            if (!panel.classList.contains('hidden')) {
                document.body.style.overflow = 'hidden';
                setTimeout(adjustPreviewScale, 60);
            } else {
                document.body.style.overflow = '';
            }
        }

        function adjustPreviewScale() {
            const cvPage = document.getElementById('preview-content');
            const wrapper = document.getElementById('preview-wrapper');
            const panel = document.getElementById('preview-panel');
            
            if (!cvPage || !wrapper || !panel) return;
            if (window.innerWidth < 768 && window.getComputedStyle(panel).display === 'none') return;

            const isMobile = window.innerWidth < 768;
            const padding = isMobile ? 24 : 64; 
            const availableWidth = panel.clientWidth - padding;
            const baseWidth = 794; // approx 210mm
            
            let scale = availableWidth / baseWidth;
            if (scale > 1) scale = 1;
            if (scale < 0.3) scale = 0.3;
            
            cvPage.style.transform = `scale(${scale})`;
            cvPage.style.transformOrigin = 'top center';
            
            const contentHeight = Math.max(cvPage.scrollHeight, 1122);
            wrapper.style.height = `${contentHeight * scale}px`;
            wrapper.style.width = `${baseWidth * scale}px`;
        }

        function applySettings() {
            document.documentElement.style.setProperty('--color-primary', cvState.settings.color);
            const picker = document.getElementById('color-picker');
            if (picker) picker.value = cvState.settings.color;
            const hex = document.getElementById('color-hex');
            if (hex) hex.innerText = cvState.settings.color.toUpperCase();

            const fontMap = { 
                'inter': "'Inter', sans-serif", 
                'poppins': "'Poppins', sans-serif", 
                'lora': "'Lora', serif", 
                'mono': "'JetBrains Mono', monospace",
                'jakarta': "'Plus Jakarta Sans', sans-serif"
            };
            document.documentElement.style.setProperty('--font-main', fontMap[cvState.settings.font] || fontMap['inter']);
            const selFont = document.querySelector('select');
            if (selFont) selFont.value = cvState.settings.font || 'inter';

            document.querySelectorAll('.template-btn').forEach(btn => {
                btn.classList.remove('active', 'border-emerald-500', 'bg-emerald-950/40');
                if (btn.innerText.toLowerCase().includes(cvState.settings.template.toLowerCase())) {
                    btn.classList.add('active', 'border-emerald-500', 'bg-emerald-950/40');
                }
            });
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type} show flex items-center`;
            
            let icon = type === 'success' ? 'check-circle' : type === 'error' ? 'triangle-exclamation' : 'info-circle';
            toast.innerHTML = `<i class="fa-solid fa-${icon} mr-2"></i> ${message}`;
            
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 250); }, 2500);
        }

        function populateSimpleInputs() {
            document.querySelectorAll('.form-input[data-field^="personal."]').forEach(input => {
                const field = input.getAttribute('data-field').split('.')[1];
                input.value = cvState.personal[field] || '';
            });
            const preview = document.getElementById('photo-preview');
            if (preview) preview.src = cvState.personal.photo || "https://placehold.co/150x150/1e293b/94a3b8?text=Foto";
        }

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    cvState.personal.photo = e.target.result;
                    const preview = document.getElementById('photo-preview');
                    if (preview) preview.src = e.target.result;
                    renderPreview();
                };
                reader.readAsDataURL(file);
            }
        }

        function removePhoto() {
            cvState.personal.photo = '';
            const preview = document.getElementById('photo-preview');
            if (preview) preview.src = "https://placehold.co/150x150/1e293b/94a3b8?text=Foto";
            renderPreview();
        }

        function renderAllForms() {
            populateSimpleInputs();
            renderListForm('experience');
            renderListForm('education');
            renderListForm('skills');
            renderListForm('languages');
            renderListForm('certifications');
        }

        function addListItem(listName) {
            const newItem = { id: Date.now() };
            if (listName === 'experience') Object.assign(newItem, { company: '', position: '', startDate: '', endDate: '', description: '' });
            if (listName === 'education') Object.assign(newItem, { institution: '', degree: '', startDate: '', endDate: '', description: '' });
            if (listName === 'skills') Object.assign(newItem, { name: '', level: 60 });
            if (listName === 'languages') Object.assign(newItem, { name: '', level: 'Conversational' });
            if (listName === 'certifications') Object.assign(newItem, { title: '', issuer: '', year: '' });
            
            cvState[listName].push(newItem);
            renderListForm(listName);
            renderPreview();
        }

        function removeListItem(listName, id) {
            cvState[listName] = cvState[listName].filter(item => item.id !== id);
            renderListForm(listName);
            renderPreview();
        }

        function updateListItem(listName, id, field, value) {
            const item = cvState[listName].find(item => item.id === id);
            if (item) {
                item[field] = value;
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(renderPreview, 250);
            }
        }

        function renderListForm(listName) {
            const container = document.getElementById(`${listName}-list`);
            if(!container) return;
            container.innerHTML = '';

            cvState[listName].forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-black/35 p-2.5 md:p-3.5 rounded-lg border border-slate-800 relative group fade-in';
                
                let innerHTML = `<button onclick="removeListItem('${listName}', ${item.id})" class="absolute top-1.5 right-1.5 p-1 text-slate-500 hover:bg-rose-500/20 hover:text-rose-400 rounded transition"><i class="fa-solid fa-times text-xs"></i></button>`;

                if (listName === 'experience') {
                    innerHTML += `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pr-5">
                            <div class="sm:col-span-2"><label class="text-[9px] text-slate-400 font-bold uppercase">Posisi / Jabatan</label><input type="text" value="${item.position||''}" oninput="updateListItem('experience', ${item.id}, 'position', this.value)" class="w-full text-xs p-1.5 input-dark rounded mt-0.5"></div>
                            <div><label class="text-[9px] text-slate-400 font-bold uppercase">Perusahaan</label><input type="text" value="${item.company||''}" oninput="updateListItem('experience', ${item.id}, 'company', this.value)" class="w-full text-xs p-1.5 input-dark rounded mt-0.5"></div>
                            <div class="grid grid-cols-2 gap-1.5">
                                <div><label class="text-[9px] text-slate-400 font-bold uppercase">Mulai</label><input type="text" value="${item.startDate||''}" oninput="updateListItem('experience', ${item.id}, 'startDate', this.value)" class="w-full text-xs p-1.5 input-dark rounded mt-0.5" placeholder="2022"></div>
                                <div><label class="text-[9px] text-slate-400 font-bold uppercase">Selesai</label><input type="text" value="${item.endDate||''}" oninput="updateListItem('experience', ${item.id}, 'endDate', this.value)" class="w-full text-xs p-1.5 input-dark rounded mt-0.5" placeholder="Skrg"></div>
                            </div>
                            <div class="sm:col-span-2"><label class="text-[9px] text-slate-400 font-bold uppercase">Deskripsi Pekerjaan</label><textarea rows="2" oninput="updateListItem('experience', ${item.id}, 'description', this.value)" class="w-full text-xs p-1.5 input-dark rounded mt-0.5 resize-none leading-snug">${item.description||''}</textarea></div>
                        </div>`;
                } else if (listName === 'education') {
                    innerHTML += `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pr-5">
                            <div class="sm:col-span-2"><label class="text-[9px] text-slate-400 font-bold uppercase">Nama Kampus / Sekolah</label><input type="text" value="${item.institution||''}" oninput="updateListItem('education', ${item.id}, 'institution', this.value)" class="w-full text-xs p-1.5 input-dark rounded mt-0.5"></div>
                            <div><label class="text-[9px] text-slate-400 font-bold uppercase">Jurusan / Gelar</label><input type="text" value="${item.degree||''}" oninput="updateListItem('education', ${item.id}, 'degree', this.value)" class="w-full text-xs p-1.5 input-dark rounded mt-0.5"></div>
                            <div class="grid grid-cols-2 gap-1.5">
                                <div><label class="text-[9px] text-slate-400 font-bold uppercase">Mulai</label><input type="text" value="${item.startDate||''}" oninput="updateListItem('education', ${item.id}, 'startDate', this.value)" class="w-full text-xs p-1.5 input-dark rounded mt-0.5"></div>
                                <div><label class="text-[9px] text-slate-400 font-bold uppercase">Lulus</label><input type="text" value="${item.endDate||''}" oninput="updateListItem('education', ${item.id}, 'endDate', this.value)" class="w-full text-xs p-1.5 input-dark rounded mt-0.5"></div>
                            </div>
                            <div class="sm:col-span-2"><textarea rows="1" oninput="updateListItem('education', ${item.id}, 'description', this.value)" class="w-full text-xs p-1.5 input-dark rounded mt-0.5 resize-none" placeholder="Catatan tambahan (opsional)">${item.description||''}</textarea></div>
                        </div>`;
                } else if (listName === 'skills') {
                    innerHTML += `
                        <div class="flex items-center gap-2 pr-5">
                            <input type="text" value="${item.name||''}" oninput="updateListItem('skills', ${item.id}, 'name', this.value)" class="flex-1 text-xs p-1.5 input-dark rounded" placeholder="Keahlian (misal: React.js)">
                            <input type="range" min="10" max="100" step="5" value="${item.level||50}" oninput="updateListItem('skills', ${item.id}, 'level', this.value)" class="w-24 accent-emerald-500">
                        </div>`;
                } else if (listName === 'languages') {
                     innerHTML += `
                        <div class="grid grid-cols-2 gap-2 pr-5">
                            <input type="text" value="${item.name||''}" oninput="updateListItem('languages', ${item.id}, 'name', this.value)" class="text-xs p-1.5 input-dark rounded" placeholder="Bahasa">
                            <select onchange="updateListItem('languages', ${item.id}, 'level', this.value)" class="text-xs p-1.5 input-dark rounded appearance-none">
                                <option value="Beginner" ${item.level==='Beginner'?'selected':''}>Dasar</option>
                                <option value="Conversational" ${item.level==='Conversational'?'selected':''}>Percakapan</option>
                                <option value="Fluent" ${item.level==='Fluent'?'selected':''}>Fasih</option>
                                <option value="Native" ${item.level==='Native'?'selected':''}>Bahasa Ibu</option>
                            </select>
                        </div>`;
                } else if (listName === 'certifications') {
                    innerHTML += `
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pr-5">
                            <div class="sm:col-span-2"><input type="text" value="${item.title||''}" oninput="updateListItem('certifications', ${item.id}, 'title', this.value)" class="w-full text-xs p-1.5 input-dark rounded" placeholder="Nama Sertifikat"></div>
                            <div><input type="text" value="${item.year||''}" oninput="updateListItem('certifications', ${item.id}, 'year', this.value)" class="w-full text-xs p-1.5 input-dark rounded" placeholder="Tahun"></div>
                            <div class="sm:col-span-3"><input type="text" value="${item.issuer||''}" oninput="updateListItem('certifications', ${item.id}, 'issuer', this.value)" class="w-full text-xs p-1.5 input-dark rounded" placeholder="Penerbit / Institusi"></div>
                        </div>`;
                }
                
                div.innerHTML = innerHTML;
                container.appendChild(div);
            });
        }

        function formatDesc(text) {
            if(!text) return '';
            if (text.includes('•') || text.includes('- ')) {
                const items = text.split(/\n|•|- /).filter(i => i.trim() !== '');
                return `<ul class="list-disc pl-4 text-xs mt-1 space-y-0.5">` + items.map(i => `<li>${i.trim()}</li>`).join('') + `</ul>`;
            }
            return `<p class="text-xs mt-1 whitespace-pre-line leading-relaxed">${text}</p>`;
        }

        const templateModern = (data) => `
            <div class="cv-template flex bg-white text-gray-800" style="font-family: var(--font-main);">
                <div class="w-[34%] text-white p-7" style="background-color: var(--color-primary)">
                    ${data.personal.photo ? `<div class="mb-5 flex justify-center"><img src="${data.personal.photo}" class="w-28 h-28 rounded-full border-4 border-white/30 object-cover shadow-sm"></div>` : ''}
                    
                    <div class="mb-6">
                        <h3 class="text-sm font-bold border-b border-white/30 pb-1.5 mb-2.5 uppercase tracking-wider text-white">Kontak</h3>
                        <div class="space-y-2 text-xs text-white/90">
                            ${data.personal.phone ? `<div class="flex items-center gap-2"><i class="fa-solid fa-phone w-3.5 text-center"></i> <span>${data.personal.phone}</span></div>` : ''}
                            ${data.personal.email ? `<div class="flex items-center gap-2"><i class="fa-solid fa-envelope w-3.5 text-center"></i> <span class="break-all">${data.personal.email}</span></div>` : ''}
                            ${data.personal.location ? `<div class="flex items-center gap-2"><i class="fa-solid fa-location-dot w-3.5 text-center"></i> <span>${data.personal.location}</span></div>` : ''}
                            ${data.personal.linkedin ? `<div class="flex items-center gap-2"><i class="fa-brands fa-linkedin w-3.5 text-center"></i> <span class="break-all">${data.personal.linkedin.replace('https://', '')}</span></div>` : ''}
                        </div>
                    </div>

                    ${data.skills.length > 0 ? `
                    <div class="mb-6">
                        <h3 class="text-sm font-bold border-b border-white/30 pb-1.5 mb-2.5 uppercase tracking-wider text-white">Keahlian</h3>
                        <div class="space-y-2">
                            ${data.skills.map(s => `
                                <div>
                                    <div class="flex justify-between text-xs mb-0.5 font-medium text-white"><span>${s.name}</span></div>
                                    <div class="w-full bg-black/20 rounded-full h-1.5 overflow-hidden"><div class="bg-white h-full rounded-full" style="width: ${s.level}%"></div></div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}

                    ${data.languages.length > 0 ? `
                    <div class="mb-6">
                        <h3 class="text-sm font-bold border-b border-white/30 pb-1.5 mb-2.5 uppercase tracking-wider text-white">Bahasa</h3>
                        <ul class="space-y-1.5 text-xs text-white/90">
                            ${data.languages.map(l => `<li><strong class="text-white">${l.name}</strong> - <span class="opacity-80">${l.level}</span></li>`).join('')}
                        </ul>
                    </div>
                    ` : ''}
                </div>
                
                <div class="w-[66%] p-7 bg-white text-gray-800">
                    <div class="mb-6">
                        <h1 class="text-3xl font-extrabold text-gray-900 uppercase tracking-tight mb-1 leading-none">${data.personal.name || 'NAMA LENGKAP'}</h1>
                        <h2 class="text-base font-semibold tracking-wider uppercase" style="color: var(--color-primary);">${data.personal.title || 'Posisi Pekerjaan'}</h2>
                        ${data.personal.summary ? `<p class="mt-3 text-xs text-gray-600 leading-relaxed text-justify">${data.personal.summary}</p>` : ''}
                    </div>

                    ${data.experience.length > 0 ? `
                    <div class="mb-6">
                        <h3 class="text-sm font-bold border-b-2 border-gray-100 pb-1.5 mb-3 uppercase tracking-wider flex items-center gap-2" style="color: var(--color-primary);"><i class="fa-solid fa-briefcase"></i> Pengalaman Kerja</h3>
                        <div class="space-y-4">
                            ${data.experience.map(e => `
                                <div class="relative pl-3.5 border-l-2 border-gray-200">
                                    <div class="absolute w-2 h-2 rounded-full -left-[5px] top-1 border border-white" style="background-color: var(--color-primary);"></div>
                                    <h4 class="font-bold text-gray-800 text-xs leading-snug">${e.position}</h4>
                                    <div class="flex justify-between text-[11px] text-gray-500 mb-0.5 font-medium">
                                        <span>${e.company}</span>
                                        <span class="text-gray-400">${e.startDate} - ${e.endDate}</span>
                                    </div>
                                    <div class="text-gray-600">${formatDesc(e.description)}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}

                    ${data.education.length > 0 ? `
                    <div class="mb-6">
                        <h3 class="text-sm font-bold border-b-2 border-gray-100 pb-1.5 mb-3 uppercase tracking-wider flex items-center gap-2" style="color: var(--color-primary);"><i class="fa-solid fa-graduation-cap"></i> Pendidikan</h3>
                        <div class="space-y-3">
                            ${data.education.map(e => `
                                <div>
                                    <h4 class="font-bold text-gray-800 text-xs leading-snug">${e.degree}</h4>
                                    <div class="flex justify-between text-[11px] text-gray-600 mb-0.5">
                                        <span class="font-medium">${e.institution}</span>
                                        <span class="text-gray-400">${e.startDate} - ${e.endDate}</span>
                                    </div>
                                    <div class="text-gray-600">${formatDesc(e.description)}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                </div>
            </div>`;

        const templateATS = (data) => `
            <div class="cv-template bg-white text-black p-10 font-serif" style="font-family: 'Times New Roman', Times, serif; line-height: 1.45;">
                <div class="text-center mb-5 border-b border-black pb-3">
                    <h1 class="text-2xl font-bold uppercase mb-1" style="color: black !important;">${data.personal.name || 'NAMA LENGKAP'}</h1>
                    <div class="text-xs">
                        ${[data.personal.location, data.personal.phone, data.personal.email, data.personal.linkedin].filter(Boolean).join(' | ')}
                    </div>
                </div>
                ${data.personal.summary ? `<div class="mb-4"><h2 class="text-xs font-bold uppercase border-b border-black mb-1.5 pb-0.5" style="color: black !important;">Ringkasan Profesional</h2><p class="text-xs text-justify">${data.personal.summary}</p></div>` : ''}
                ${data.experience.length > 0 ? `<div class="mb-4"><h2 class="text-xs font-bold uppercase border-b border-black mb-1.5 pb-0.5" style="color: black !important;">Pengalaman Kerja</h2>${data.experience.map(e => `<div class="mb-2.5"><div class="flex justify-between font-bold text-xs"><span>${e.position}, ${e.company}</span><span>${e.startDate} - ${e.endDate}</span></div><div class="text-xs mt-0.5 ml-3">${formatDesc(e.description)}</div></div>`).join('')}</div>` : ''}
                ${data.education.length > 0 ? `<div class="mb-4"><h2 class="text-xs font-bold uppercase border-b border-black mb-1.5 pb-0.5" style="color: black !important;">Pendidikan</h2>${data.education.map(e => `<div class="mb-2 text-xs"><div class="flex justify-between font-bold"><span>${e.institution}</span><span>${e.startDate} - ${e.endDate}</span></div><div>${e.degree} ${e.description ? ` - ${e.description}` : ''}</div></div>`).join('')}</div>` : ''}
                ${data.skills.length > 0 || data.languages.length > 0 ? `<div class="mb-4"><h2 class="text-xs font-bold uppercase border-b border-black mb-1.5 pb-0.5" style="color: black !important;">Keahlian & Bahasa</h2>${data.skills.length > 0 ? `<p class="text-xs mb-1"><strong>Skill:</strong> ${data.skills.map(s => s.name).join(', ')}</p>` : ''}${data.languages.length > 0 ? `<p class="text-xs"><strong>Bahasa:</strong> ${data.languages.map(l => l.name).join(', ')}</p>` : ''}</div>` : ''}
            </div>`;

        const templateMinimalist = (data) => templateModern(data).replace('w-[34%] text-white p-7', 'w-[34%] bg-gray-100 text-gray-800 p-7').replace(/text-white/g, 'text-gray-800').replace(/bg-black\/20/g, 'bg-gray-300').replace(/bg-white/g, 'bg-primary');
        const templateCreative = (data) => templateModern(data).replace('style="background-color: var(--color-primary)"', 'style="background: linear-gradient(155deg, var(--color-primary), #020617)"');
        const templateClassic = (data) => templateModern(data).replace('font-family: var(--font-main);', "font-family: 'Lora', serif;");

        function renderPreview() {
            const container = document.getElementById('preview-content');
            if(!container) return;
            const tpl = cvState.settings.template;
            
            if (tpl === 'ats') container.innerHTML = templateATS(cvState);
            else if (tpl === 'minimalist') container.innerHTML = templateMinimalist(cvState);
            else if (tpl === 'creative') container.innerHTML = templateCreative(cvState);
            else if (tpl === 'classic') container.innerHTML = templateClassic(cvState);
            else container.innerHTML = templateModern(cvState);
            
            setTimeout(adjustPreviewScale, 30);
        }

        async function exportCV(format) {
            const element = document.getElementById('preview-content');
            const fileName = `CV_${cvState.personal.name.replace(/\s+/g, '_') || 'Resume'}`;
            showToast(`Menyiapkan ${format.toUpperCase()}...`, 'info');

            try {
                if (format === 'pdf') {
                    const origTransform = element.style.transform;
                    element.style.transform = 'scale(1)';
                    const opt = {
                        margin: 0,
                        filename: `${fileName}.pdf`,
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2, useCORS: true, windowWidth: 794 },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    };
                    await html2pdf().set(opt).from(element).save();
                    element.style.transform = origTransform;
                    showToast('PDF berhasil disimpan!', 'success');
                } else if (format === 'png') {
                    const origTransform = element.style.transform;
                    element.style.transform = 'scale(1)';
                    const canvas = await html2canvas(element, { scale: 2, useCORS: true });
                    canvas.toBlob(blob => {
                        saveAs(blob, `${fileName}.png`);
                        element.style.transform = origTransform;
                        showToast('Gambar berhasil disimpan!', 'success');
                    });
                } else if (format === 'html') {
                    const htmlBlob = new Blob([`<!DOCTYPE html><html><head><meta charset="utf-8"><script src="https://cdn.tailwindcss.com"><\/script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>:root{--color-primary:${cvState.settings.color};} body{background:#334155;display:flex;justify-content:center;padding:20px;} .cv-page{width:210mm;min-height:297mm;background:white;}</style></head><body><div class="cv-page">${element.innerHTML}</div></body></html>`], {type: "text/html;charset=utf-8"});
                    saveAs(htmlBlob, `${fileName}.html`);
                    showToast('HTML berhasil disimpan!', 'success');
                } else if (format === 'txt') {
                    const txt = `${cvState.personal.name.toUpperCase()}\n${cvState.personal.title}\n${cvState.personal.email} | ${cvState.personal.phone}\n${cvState.personal.location}\n\nRINGKASAN:\n${cvState.personal.summary}`;
                    saveAs(new Blob([txt], {type: "text/plain;charset=utf-8"}), `${fileName}.txt`);
                    showToast('TXT berhasil disimpan!', 'success');
                } else if (format === 'docx') {
                    const { Document, Packer, Paragraph, HeadingLevel, AlignmentType } = docx;
                    const doc = new Document({
                        sections: [{
                            children: [
                                new Paragraph({ text: (cvState.personal.name || 'CV').toUpperCase(), heading: HeadingLevel.HEADING_1, alignment: AlignmentType.CENTER }),
                                new Paragraph({ text: `${cvState.personal.location} | ${cvState.personal.phone} | ${cvState.personal.email}`, alignment: AlignmentType.CENTER }),
                                new Paragraph({ text: "PROFIL PROFESIONAL", heading: HeadingLevel.HEADING_2 }),
                                new Paragraph({ text: cvState.personal.summary || '' })
                            ]
                        }]
                    });
                    Packer.toBlob(doc).then(blob => { saveAs(blob, `${fileName}.docx`); showToast('DOCX berhasil disimpan!', 'success'); });
                }
            } catch (err) {
                console.error(err);
                showToast(`Gagal export: ${err.message}`, 'error');
            }
        }
    </script>
</body>
</html>
