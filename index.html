<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern CV Builder PRO</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/docx@8.2.3/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        primary: 'var(--color-primary)',
                        bgDark: '#0a0f16', // Warna background utama yang lebih deep seperti di foto
                        panelDark: '#121822' // Warna panel 
                    },
                    fontFamily: {
                        'jakarta': ['Plus Jakarta Sans', 'sans-serif'],
                        'inter': ['Inter', 'sans-serif'],
                        'poppins': ['Poppins', 'sans-serif'],
                        'lora': ['Lora', 'serif'],
                        'mono': ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --color-primary: #10b981; /* Default Emerald */
            --font-main: 'Inter', sans-serif;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #080c13;
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
            /* Memastikan body tidak bisa di-scroll horizontal */
            overflow-x: hidden; 
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .hide-scroll-arrows::-webkit-scrollbar { display: none; }

        .glass-panel {
            background-color: #0b111a;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-dark {
            background-color: #121824;
            border: 1px solid #233045;
            color: #f8fafc;
            transition: all 0.3s ease;
            font-size: 14px !important; 
        }
        
        .input-dark:hover { border-color: rgba(16, 185, 129, 0.4); }
        .input-dark:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 1px #10b981;
            outline: none;
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            padding: 0.75rem;
            background: #080c13;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            overflow-x: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            width: 100%;
        }

        .nav-tab {
            min-width: 72px;
            height: 72px;
            padding: 0.5rem;
            border-radius: 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #64748b;
            background: #0f1520; /* Warna background tab idle */
            border: 1px solid #1e293b;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column; /* Stack icon and text */
            justify-content: center;
            align-items: center;
            gap: 0.3rem;
            flex-shrink: 0; /* Prevent shrinking on mobile */
        }
        
        .nav-tab i { font-size: 1.25rem; }
        
        .nav-tab:hover:not(.active) {
            background: #151e2d;
            color: #94a3b8;
        }
        
        .nav-tab.active {
            background: rgba(16, 185, 129, 0.05);
            color: #10b981;
            border-color: #10b981;
        }

        /* Tombol Header */
        .btn-header-icon {
            width: 40px;
            height: 40px;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-action {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #10b981;
        }
        .btn-action:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        /* CV Target Size Fix */
        .cv-page {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        
        .cv-template { width: 100%; height: 100%; color: #1e293b; line-height: 1.5; font-family: var(--font-main); }
        .cv-template h1, .cv-template h2, .cv-template h3 { color: var(--color-primary); }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Toast Fix */
        #toast-container { position: fixed; bottom: 80px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        @media (min-width: 768px) { #toast-container { bottom: 20px; } }
        .toast { padding: 12px 20px; border-radius: 8px; color: white; font-weight: 500; box-shadow: 0 4px 20px rgba(0,0,0,0.5); transform: translateX(120%); transition: transform 0.3s ease-out; backdrop-filter: blur(10px); }
        .toast.show { transform: translateX(0); }
        .toast.success { background: rgba(16, 185, 129, 0.9); border: 1px solid #10b981; }
        .toast.error { background: rgba(239, 68, 68, 0.9); border: 1px solid #ef4444; }
        .toast.info { background: rgba(14, 165, 233, 0.9); border: 1px solid #0ea5e9; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden w-full max-w-full">

    <!-- Header -->
    <header class="bg-[#0b111a] border-b border-white/5 px-3 py-3 md:px-5 md:py-4 flex justify-between items-center z-20 shrink-0 w-full">
        <div class="flex items-center gap-3">
            <!-- LOGO: Ganti URL src gambar ini dengan file logo Anda sendiri -->
            <div class="w-12 h-12 rounded-xl bg-[#121824] border border-emerald-500/20 overflow-hidden flex items-center justify-center shrink-0">
                <img src="https://ui-avatars.com/api/?name=DN&background=121824&color=10b981&bold=true&font-size=0.4" alt="Logo" class="w-full h-full object-cover">
            </div>
            <div>
                <h1 class="text-base md:text-xl font-extrabold tracking-tight text-white leading-tight">
                    CV <span class="text-emerald-400">Builder</span>
                </h1>
                <p class="text-slate-400 text-[10px] md:text-xs font-medium">PRO Edition</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <!-- Edit / Load Dummy Button (Ikon Pensil) -->
            <button onclick="loadDummyData()" title="Load Data Contoh" class="btn-header-icon bg-[#121824] border border-[#1e293b] text-emerald-400 hover:bg-[#1a2333]">
                <i class="fa-solid fa-pencil"></i>
            </button>
            
            <!-- Reset Button (Ikon Tong Sampah) -->
            <button onclick="clearData()" title="Hapus Semua Data" class="btn-header-icon bg-[#2e151e] border border-[#4a1c27] text-rose-400 hover:bg-[#3d1a26]">
                <i class="fa-solid fa-trash-can"></i>
            </button>
            
            <!-- Export Dropdown -->
            <div class="relative group ml-1">
                <button class="btn-action text-white text-sm px-4 py-2.5 h-[40px] rounded-xl font-bold flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i> <span>Export</span>
                </button>
                <div class="absolute right-0 mt-2 w-48 bg-[#0a0a0e] rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.8)] border border-emerald-500/30 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 overflow-hidden">
                    <div class="py-1 divide-y divide-white/5">
                        <button onclick="exportCV('pdf')" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-300 hover:bg-emerald-500/20 hover:text-white flex items-center gap-3"><i class="fa-solid fa-file-pdf text-rose-400 w-4"></i> PDF Document</button>
                        <button onclick="exportCV('docx')" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-300 hover:bg-emerald-500/20 hover:text-white flex items-center gap-3"><i class="fa-solid fa-file-word text-blue-400 w-4"></i> Word (DOCX)</button>
                        <button onclick="exportCV('png')" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-300 hover:bg-emerald-500/20 hover:text-white flex items-center gap-3"><i class="fa-solid fa-image text-emerald-400 w-4"></i> Image (PNG)</button>
                        <button onclick="exportCV('html')" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-300 hover:bg-emerald-500/20 hover:text-white flex items-center gap-3"><i class="fa-brands fa-html5 text-orange-400 w-4"></i> Web HTML</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden w-full relative">
        
        <!-- Left Panel: Form Editor -->
        <div class="w-full md:w-[45%] lg:w-[40%] flex flex-col glass-panel z-10 h-full relative">
            
            <!-- Section Tabs (Bentuk Kotak atas-bawah sesuai referensi foto 1) -->
            <div class="nav-tabs hide-scroll-arrows">
                <div onclick="switchTab('design')" class="nav-tab active" data-target="design"><i class="fa-solid fa-palette"></i><span>Design</span></div>
                <div onclick="switchTab('personal')" class="nav-tab" data-target="personal"><i class="fa-solid fa-user"></i><span>Profil</span></div>
                <div onclick="switchTab('experience')" class="nav-tab" data-target="experience"><i class="fa-solid fa-briefcase"></i><span>Kerja</span></div>
                <div onclick="switchTab('education')" class="nav-tab" data-target="education"><i class="fa-solid fa-graduation-cap"></i><span>Didik</span></div>
                <div onclick="switchTab('skills')" class="nav-tab" data-target="skills"><i class="fa-solid fa-star"></i><span>Skill</span></div>
                <div onclick="switchTab('projects')" class="nav-tab" data-target="projects"><i class="fa-solid fa-award"></i><span>Extra</span></div>
            </div>

            <!-- Form Content Area -->
            <!-- Memastikan tidak ada padding yang membuat konten terlalu sempit -->
            <div id="form-container" class="flex-1 overflow-y-auto p-4 custom-scrollbar pb-28 md:pb-6 relative z-10 w-full">
                
                <!-- DESIGN SECTION -->
                <div id="section-design" class="form-section fade-in w-full">
                    <h2 class="text-base md:text-lg font-bold text-white mb-4 flex items-center gap-2"><i class="fa-solid fa-sliders text-emerald-400"></i> Pengaturan Visual</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Template CV</label>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <button onclick="updateState('template', 'modern')" class="template-btn bg-[#121824] border border-[#1e293b] rounded-xl p-3 text-left hover:border-emerald-500/50 transition relative overflow-hidden group">
                                    <div class="absolute inset-0 bg-emerald-500/10 opacity-0 group-[.active]:opacity-100 transition-opacity"></div>
                                    <div class="font-bold text-slate-200 relative z-10">Modern</div>
                                    <div class="text-[10px] text-slate-500 mt-1 relative z-10">Kolom ganda elegan</div>
                                </button>
                                <button onclick="updateState('template', 'classic')" class="template-btn bg-[#121824] border border-[#1e293b] rounded-xl p-3 text-left hover:border-emerald-500/50 transition relative overflow-hidden group">
                                    <div class="absolute inset-0 bg-emerald-500/10 opacity-0 group-[.active]:opacity-100 transition-opacity"></div>
                                    <div class="font-bold text-slate-200 relative z-10">Classic</div>
                                    <div class="text-[10px] text-slate-500 mt-1 relative z-10">Formal, garis tegas</div>
                                </button>
                                <button onclick="updateState('template', 'creative')" class="template-btn bg-[#121824] border border-[#1e293b] rounded-xl p-3 text-left hover:border-emerald-500/50 transition relative overflow-hidden group">
                                    <div class="absolute inset-0 bg-emerald-500/10 opacity-0 group-[.active]:opacity-100 transition-opacity"></div>
                                    <div class="font-bold text-slate-200 relative z-10">Creative</div>
                                    <div class="text-[10px] text-slate-500 mt-1 relative z-10">Elemen warna penuh</div>
                                </button>
                                <button onclick="updateState('template', 'minimalist')" class="template-btn bg-[#121824] border border-[#1e293b] rounded-xl p-3 text-left hover:border-emerald-500/50 transition relative overflow-hidden group">
                                    <div class="absolute inset-0 bg-emerald-500/10 opacity-0 group-[.active]:opacity-100 transition-opacity"></div>
                                    <div class="font-bold text-slate-200 relative z-10">Minimalist</div>
                                    <div class="text-[10px] text-slate-500 mt-1 relative z-10">Bersih, banyak spasi</div>
                                </button>
                                <button onclick="updateState('template', 'ats')" class="template-btn bg-[#0a1a16] border border-emerald-900/50 rounded-xl p-3 text-left hover:border-emerald-500/80 transition relative overflow-hidden group sm:col-span-2">
                                    <div class="absolute inset-0 bg-emerald-500/10 opacity-0 group-[.active]:opacity-100 transition-opacity"></div>
                                    <div class="font-bold text-emerald-400 relative z-10">ATS-Friendly <i class="fa-solid fa-robot text-[10px] ml-1"></i></div>
                                    <div class="text-[10px] text-emerald-500/70 mt-1 relative z-10">Standar rekrutmen perusahaan. Bebas grafis rumit.</div>
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 border-t border-[#1e293b] pt-4">
                            <div class="group">
                                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Warna Aksen</label>
                                <div class="flex items-center gap-3 bg-[#121824] border border-[#1e293b] p-2 rounded-xl">
                                    <input type="color" id="color-picker" value="#10b981" class="w-8 h-8 rounded cursor-pointer border-0 p-0 bg-transparent" onchange="updateState('color', this.value)">
                                    <span class="text-xs font-mono font-medium text-slate-300" id="color-hex">#10B981</span>
                                </div>
                            </div>
                            <div class="group">
                                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Jenis Font</label>
                                <div class="relative">
                                    <select onchange="updateState('font', this.value)" class="w-full p-2.5 input-dark rounded-xl appearance-none relative z-20 font-medium text-xs">
                                        <option value="inter">Inter (Modern Sans)</option>
                                        <option value="poppins">Poppins (Geometric)</option>
                                        <option value="jakarta">Jakarta Sans (Clean)</option>
                                        <option value="lora">Lora (Classic Serif)</option>
                                        <option value="mono">Roboto Mono (Tech)</option>
                                    </select>
                                    <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 text-[10px] z-30 pointer-events-none"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- PERSONAL SECTION -->
                <div id="section-personal" class="form-section hidden fade-in w-full">
                    <h2 class="text-base md:text-lg font-bold text-white mb-4 flex items-center gap-2"><i class="fa-solid fa-address-card text-emerald-400"></i> Profil</h2>
                    
                    <div class="bg-[#121824] border border-[#1e293b] p-3 rounded-xl mb-4 flex items-center gap-3 w-full">
                        <div class="w-14 h-14 md:w-16 md:h-16 bg-slate-800 rounded-full overflow-hidden flex items-center justify-center shrink-0 border border-slate-600 relative group cursor-pointer">
                            <img id="photo-preview" src="https://placehold.co/150x150/1e293b/94a3b8?text=Foto" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                <i class="fa-solid fa-camera text-white"></i>
                            </div>
                            <input type="file" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="handlePhotoUpload(event)">
                        </div>
                        <div class="flex-1">
                            <p class="text-[11px] md:text-xs font-bold text-slate-200">Foto (Opsional)</p>
                            <button onclick="removePhoto()" class="text-[10px] text-rose-400 mt-1 hover:text-rose-300 font-medium bg-rose-500/10 px-2 py-1 rounded w-fit"><i class="fa-solid fa-trash-can mr-1"></i> Hapus</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Nama Lengkap</label>
                            <input type="text" data-field="personal.name" oninput="handleInput(event)" class="form-input w-full p-2.5 input-dark rounded-lg" placeholder="Joko Widodo">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Jabatan / Posisi</label>
                            <input type="text" data-field="personal.title" oninput="handleInput(event)" class="form-input w-full p-2.5 input-dark rounded-lg" placeholder="Software Engineer">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Email</label>
                            <input type="email" data-field="personal.email" oninput="handleInput(event)" class="form-input w-full p-2.5 input-dark rounded-lg" placeholder="email@contoh.com">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">No. Telepon</label>
                            <input type="tel" data-field="personal.phone" oninput="handleInput(event)" class="form-input w-full p-2.5 input-dark rounded-lg" placeholder="+62 812 3456">
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Lokasi (Kota, Negara)</label>
                            <input type="text" data-field="personal.location" oninput="handleInput(event)" class="form-input w-full p-2.5 input-dark rounded-lg" placeholder="Jakarta, Indonesia">
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Ringkasan Profil</label>
                            <textarea data-field="personal.summary" oninput="handleInput(event)" rows="3" class="form-input w-full p-2.5 input-dark rounded-lg resize-none" placeholder="Tuliskan profil singkat..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- LIST GENERATOR SECTIONS -->
                <div id="section-experience" class="form-section hidden fade-in w-full">
                    <div class="flex justify-between items-center mb-3 border-b border-[#1e293b] pb-2">
                        <h2 class="text-base md:text-lg font-bold text-white flex items-center gap-2"><i class="fa-solid fa-briefcase text-emerald-400"></i> Kerja</h2>
                        <button onclick="addListItem('experience')" class="text-[10px] bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-lg hover:bg-emerald-500/30 transition font-bold"><i class="fa-solid fa-plus"></i> Tambah</button>
                    </div>
                    <div id="experience-list" class="space-y-3"></div>
                </div>

                <div id="section-education" class="form-section hidden fade-in w-full">
                    <div class="flex justify-between items-center mb-3 border-b border-[#1e293b] pb-2">
                        <h2 class="text-base md:text-lg font-bold text-white flex items-center gap-2"><i class="fa-solid fa-graduation-cap text-emerald-400"></i> Didik</h2>
                        <button onclick="addListItem('education')" class="text-[10px] bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-lg hover:bg-emerald-500/30 transition font-bold"><i class="fa-solid fa-plus"></i> Tambah</button>
                    </div>
                    <div id="education-list" class="space-y-3"></div>
                </div>

                <div id="section-skills" class="form-section hidden fade-in w-full">
                    <h2 class="text-base md:text-lg font-bold text-white mb-3 flex items-center gap-2"><i class="fa-solid fa-bolt text-emerald-400"></i> Skill & Bahasa</h2>
                    
                    <div class="mb-2 flex justify-between items-center bg-[#121824] p-2 rounded-lg border border-[#1e293b]">
                        <h3 class="text-[10px] font-bold text-slate-300 uppercase tracking-widest ml-1">Hard Skills</h3>
                        <button onclick="addListItem('skills')" class="text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded hover:bg-emerald-500/20"><i class="fa-solid fa-plus"></i> Tambah</button>
                    </div>
                    <div id="skills-list" class="space-y-2 mb-5"></div>

                    <div class="mb-2 flex justify-between items-center bg-[#121824] p-2 rounded-lg border border-[#1e293b]">
                        <h3 class="text-[10px] font-bold text-slate-300 uppercase tracking-widest ml-1">Bahasa</h3>
                        <button onclick="addListItem('languages')" class="text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded hover:bg-emerald-500/20"><i class="fa-solid fa-plus"></i> Tambah</button>
                    </div>
                    <div id="languages-list" class="space-y-2"></div>
                </div>

                <div id="section-projects" class="form-section hidden fade-in w-full">
                    <div class="flex justify-between items-center mb-3 border-b border-[#1e293b] pb-2">
                        <h2 class="text-base md:text-lg font-bold text-white flex items-center gap-2"><i class="fa-solid fa-award text-emerald-400"></i> Extra (Sertifikat)</h2>
                        <button onclick="addListItem('certifications')" class="text-[10px] bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-lg hover:bg-emerald-500/30 transition font-bold"><i class="fa-solid fa-plus"></i> Tambah</button>
                    </div>
                    <div id="certifications-list" class="space-y-3"></div>
                </div>
            </div>
        </div>

        <!-- Right Panel: Live Preview -->
        <div id="preview-panel" class="hidden md:flex fixed md:relative inset-0 md:inset-auto w-full md:w-[55%] lg:w-[60%] bg-[#080c13] overflow-y-auto flex-col items-center py-6 md:py-8 z-[100] md:z-10 shadow-inner custom-scrollbar transition-opacity duration-300">
            
            <!-- Mobile Close Button -->
            <div class="md:hidden sticky top-0 w-full flex justify-end px-4 py-3 z-[110] bg-gradient-to-b from-[#080c13] to-transparent pointer-events-none">
                <button onclick="toggleMobilePreview()" class="w-10 h-10 bg-rose-500/20 border border-rose-500/50 text-rose-400 rounded-xl flex items-center justify-center shadow-lg pointer-events-auto hover:bg-rose-500/40">
                    <i class="fa-solid fa-times text-lg"></i>
                </button>
            </div>

            <div class="text-slate-400 text-[10px] md:text-xs mb-4 font-bold tracking-widest uppercase px-4 text-center bg-[#121824] py-1.5 rounded-full border border-[#1e293b] shadow-sm">
                A4 Preview
            </div>

            <div id="scale-container" class="w-full flex justify-center pb-24 md:pb-12 px-4 md:px-8">
                <div id="preview-wrapper" class="origin-top shadow-[0_20px_60px_rgba(0,0,0,0.8)] border border-slate-700/50 relative bg-white">
                    <div id="preview-content" class="cv-page">
                        <!-- CV Content Injection -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile Sticky Preview Toggle Button -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 p-3 bg-[#0b111a]/95 backdrop-blur-xl border-t border-white/5 z-[9999] pb-[calc(0.75rem+env(safe-area-inset-bottom))]">
        <button onclick="toggleMobilePreview()" class="w-full btn-action text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 text-sm tracking-wide">
            <i class="fa-solid fa-eye text-emerald-400"></i> Tampilkan Preview CV
        </button>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <script>
        // --- STATE MANAGEMENT & DUMMY DATA ---
        const emptyState = {
            settings: { theme: 'light', color: '#10B981', font: 'jakarta', template: 'modern' },
            personal: { name: '', title: '', email: '', phone: '', location: '', linkedin: '', website: '', summary: '', photo: '' },
            experience: [], education: [], skills: [], languages: [], certifications: []
        };

        const dummyData = {
            settings: { theme: 'light', color: '#10B981', font: 'jakarta', template: 'modern' },
            personal: { 
                name: 'Budi Santoso', title: 'Senior Software Engineer', email: 'budi.santoso@email.com', 
                phone: '+62 811 2233 4455', location: 'Jakarta, Indonesia', 
                summary: 'Software Engineer berpengalaman dalam pengembangan web.',
                photo: ''
            },
            experience: [
                { id: Date.now(), company: 'PT Teknologi', position: 'Lead Developer', startDate: 'Jan 2021', endDate: 'Sekarang', description: '• Memimpin tim developer.\n• Optimasi sistem.' }
            ],
            education: [
                { id: Date.now(), institution: 'Universitas Indonesia', degree: 'S1 Ilmu Komputer', startDate: '2014', endDate: '2018', gpa: '3.85', description: 'Cum Laude' }
            ],
            skills: [
                { id: Date.now(), name: 'JavaScript', level: 90 }, { id: Date.now()-1, name: 'React', level: 85 }
            ],
            languages: [
                { id: Date.now(), name: 'Indonesia', level: 'Native' }, { id: Date.now()-1, name: 'Inggris', level: 'Advanced' }
            ],
            certifications: []
        };

        let cvState = JSON.parse(localStorage.getItem('cvStateV3')) || JSON.parse(JSON.stringify(emptyState));
        let debounceTimer;

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            applySettings();
            renderAllForms();
            renderPreview();
            
            window.addEventListener('resize', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(adjustPreviewScale, 100);
            });
            
            setInterval(() => localStorage.setItem('cvStateV3', JSON.stringify(cvState)), 5000);
        });

        function updateState(field, value, noRender = false) {
            if (field.includes('.')) {
                const parts = field.split('.');
                cvState[parts[0]][parts[1]] = value;
            } else if (['template', 'color', 'font'].includes(field)) {
                cvState.settings[field] = value;
                applySettings();
            } else {
                cvState[field] = value;
            }
            
            if (!noRender) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(renderPreview, 200);
            }
        }

        function handleInput(event) {
            const field = event.target.getAttribute('data-field');
            if (field) updateState(field, event.target.value);
        }

        function loadDummyData() {
            cvState = JSON.parse(JSON.stringify(dummyData));
            applySettings();
            renderAllForms();
            renderPreview();
            showToast('Data diisi otomatis', 'success');
        }

        function clearData() {
            if(confirm("Yakin ingin mereset semua data?")) {
                cvState = JSON.parse(JSON.stringify(emptyState));
                localStorage.removeItem('cvStateV3');
                applySettings();
                renderAllForms();
                renderPreview();
                showToast('Data direset', 'info');
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.nav-tab[data-target="${tabId}"]`).classList.add('active');

            document.querySelectorAll('.form-section').forEach(sec => sec.classList.add('hidden'));
            document.getElementById(`section-${tabId}`).classList.remove('hidden');
            
            // Scroll nav tab to center active item on mobile
            const activeTab = document.querySelector(`.nav-tab[data-target="${tabId}"]`);
            activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }

        function toggleMobilePreview() {
            const panel = document.getElementById('preview-panel');
            panel.classList.toggle('hidden');
            if(!panel.classList.contains('hidden')) {
                document.body.style.overflow = 'hidden';
                setTimeout(adjustPreviewScale, 50);
            } else {
                document.body.style.overflow = ''; // allow general body scroll
                document.body.style.overflowX = 'hidden'; // preserve x hidden
            }
        }

        function adjustPreviewScale() {
            const cvPage = document.getElementById('preview-content');
            const wrapper = document.getElementById('preview-wrapper');
            const panel = document.getElementById('preview-panel');
            
            if(window.getComputedStyle(panel).display === 'none') return;

            // Pastikan lebar tidak tembus layar
            const isMobile = window.innerWidth < 768;
            const padding = isMobile ? 32 : 64; 
            const availableWidth = panel.clientWidth - padding;
            const baseWidth = 794; // 210mm in px
            
            let scale = availableWidth / baseWidth;
            if (scale > 1) scale = 1;
            
            cvPage.style.transform = `scale(${scale})`;
            cvPage.style.transformOrigin = 'top left';
            
            const contentHeight = Math.max(cvPage.scrollHeight, 1122);
            wrapper.style.height = `${contentHeight * scale}px`;
            wrapper.style.width = `${baseWidth * scale}px`;
        }

        function applySettings() {
            document.documentElement.style.setProperty('--color-primary', cvState.settings.color);
            document.getElementById('color-picker').value = cvState.settings.color;
            document.getElementById('color-hex').innerText = cvState.settings.color.toUpperCase();

            const fontMap = { 
                'inter': "'Inter', sans-serif", 
                'poppins': "'Poppins', sans-serif", 
                'lora': "'Lora', serif", 
                'mono': "'JetBrains Mono', monospace",
                'jakarta': "'Plus Jakarta Sans', sans-serif"
            };
            document.documentElement.style.setProperty('--font-main', fontMap[cvState.settings.font] || fontMap['jakarta']);
            document.querySelector('select').value = cvState.settings.font || 'jakarta';

            document.querySelectorAll('.template-btn').forEach(btn => {
                btn.classList.remove('active', 'border-emerald-500', 'bg-[#15201d]');
                if(btn.innerText.toLowerCase().includes(cvState.settings.template.toLowerCase())) {
                    btn.classList.add('active', 'border-emerald-500', 'bg-[#15201d]');
                }
            });
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type} show text-xs flex items-center`;
            let icon = type === 'success' ? 'check-circle' : type === 'error' ? 'triangle-exclamation' : 'info-circle';
            toast.innerHTML = `<i class="fa-solid fa-${icon} mr-2 text-base"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function populateSimpleInputs() {
            document.querySelectorAll('.form-input[data-field^="personal."]').forEach(input => {
                const field = input.getAttribute('data-field').split('.')[1];
                input.value = cvState.personal[field] || '';
            });
            document.getElementById('photo-preview').src = cvState.personal.photo || "https://placehold.co/150x150/1e293b/94a3b8?text=Foto";
        }

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    cvState.personal.photo = e.target.result;
                    document.getElementById('photo-preview').src = e.target.result;
                    renderPreview();
                };
                reader.readAsDataURL(file);
            }
        }

        function removePhoto() {
            cvState.personal.photo = '';
            document.getElementById('photo-preview').src = "https://placehold.co/150x150/1e293b/94a3b8?text=Foto";
            renderPreview();
        }

        function renderAllForms() {
            populateSimpleInputs();
            renderListForm('experience');
            renderListForm('education');
            renderListForm('skills');
            renderListForm('languages');
            renderListForm('certifications');
        }

        function addListItem(listName) {
            const newItem = { id: Date.now() };
            if (listName === 'experience') Object.assign(newItem, { company: '', position: '', startDate: '', endDate: '', description: '' });
            if (listName === 'education') Object.assign(newItem, { institution: '', degree: '', startDate: '', endDate: '', gpa: '', description: '' });
            if (listName === 'skills') Object.assign(newItem, { name: '', level: 50 });
            if (listName === 'languages') Object.assign(newItem, { name: '', level: 'Beginner' });
            if (listName === 'certifications') Object.assign(newItem, { title: '', issuer: '', year: '' });
            
            cvState[listName].push(newItem);
            renderListForm(listName);
            renderPreview();
        }

        function removeListItem(listName, id) {
            cvState[listName] = cvState[listName].filter(item => item.id !== id);
            renderListForm(listName);
            renderPreview();
        }

        function updateListItem(listName, id, field, value) {
            const item = cvState[listName].find(item => item.id === id);
            if (item) {
                item[field] = value;
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(renderPreview, 300);
            }
        }

        function renderListForm(listName) {
            const container = document.getElementById(`${listName}-list`);
            if(!container) return;
            container.innerHTML = '';

            cvState[listName].forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-[#121824] p-3 rounded-xl border border-[#1e293b] relative group fade-in w-full';
                
                let innerHTML = `<button onclick="removeListItem('${listName}', ${item.id})" class="absolute top-2 right-2 p-1.5 text-slate-500 hover:bg-rose-500/20 hover:text-rose-400 rounded-lg transition"><i class="fa-solid fa-times"></i></button>`;

                if (listName === 'experience') {
                    innerHTML += `
                        <div class="grid grid-cols-1 gap-2 pr-6 w-full">
                            <div><label class="text-[10px] text-slate-400 font-bold uppercase">Jabatan</label><input type="text" value="${item.position}" oninput="updateListItem('experience', ${item.id}, 'position', this.value)" class="w-full text-xs p-2 input-dark rounded-lg mt-0.5"></div>
                            <div><label class="text-[10px] text-slate-400 font-bold uppercase">Perusahaan</label><input type="text" value="${item.company}" oninput="updateListItem('experience', ${item.id}, 'company', this.value)" class="w-full text-xs p-2 input-dark rounded-lg mt-0.5"></div>
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="text-[10px] text-slate-400 font-bold uppercase">Mulai</label><input type="text" value="${item.startDate}" oninput="updateListItem('experience', ${item.id}, 'startDate', this.value)" class="w-full text-xs p-2 input-dark rounded-lg mt-0.5"></div>
                                <div><label class="text-[10px] text-slate-400 font-bold uppercase">Selesai</label><input type="text" value="${item.endDate}" oninput="updateListItem('experience', ${item.id}, 'endDate', this.value)" class="w-full text-xs p-2 input-dark rounded-lg mt-0.5"></div>
                            </div>
                            <div class="mt-1"><label class="text-[10px] text-slate-400 font-bold uppercase">Deskripsi</label><textarea rows="2" oninput="updateListItem('experience', ${item.id}, 'description', this.value)" class="w-full text-xs p-2 input-dark rounded-lg mt-0.5 resize-none">${item.description}</textarea></div>
                        </div>`;
                } else if (listName === 'education') {
                    innerHTML += `
                        <div class="grid grid-cols-1 gap-2 pr-6 w-full">
                            <div><label class="text-[10px] text-slate-400 font-bold uppercase">Institusi</label><input type="text" value="${item.institution}" oninput="updateListItem('education', ${item.id}, 'institution', this.value)" class="w-full text-xs p-2 input-dark rounded-lg mt-0.5"></div>
                            <div><label class="text-[10px] text-slate-400 font-bold uppercase">Gelar</label><input type="text" value="${item.degree}" oninput="updateListItem('education', ${item.id}, 'degree', this.value)" class="w-full text-xs p-2 input-dark rounded-lg mt-0.5"></div>
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="text-[10px] text-slate-400 font-bold uppercase">Mulai</label><input type="text" value="${item.startDate}" oninput="updateListItem('education', ${item.id}, 'startDate', this.value)" class="w-full text-xs p-2 input-dark rounded-lg mt-0.5"></div>
                                <div><label class="text-[10px] text-slate-400 font-bold uppercase">Selesai</label><input type="text" value="${item.endDate}" oninput="updateListItem('education', ${item.id}, 'endDate', this.value)" class="w-full text-xs p-2 input-dark rounded-lg mt-0.5"></div>
                            </div>
                        </div>`;
                } else if (listName === 'skills') {
                    innerHTML += `
                        <div class="flex items-center gap-2 pr-6 w-full">
                            <div class="flex-1"><input type="text" value="${item.name}" oninput="updateListItem('skills', ${item.id}, 'name', this.value)" class="w-full text-xs p-2 input-dark rounded-lg" placeholder="Cth: Node.js"></div>
                            <div class="w-1/3"><input type="range" min="10" max="100" step="10" value="${item.level}" oninput="updateListItem('skills', ${item.id}, 'level', this.value);" class="w-full accent-emerald-500"></div>
                        </div>`;
                } else if (listName === 'languages') {
                     innerHTML += `
                        <div class="flex flex-col sm:flex-row gap-2 pr-6 w-full">
                            <div class="flex-1"><input type="text" value="${item.name}" oninput="updateListItem('languages', ${item.id}, 'name', this.value)" class="w-full text-xs p-2 input-dark rounded-lg" placeholder="English"></div>
                            <div class="sm:w-1/3">
                                <select onchange="updateListItem('languages', ${item.id}, 'level', this.value)" class="w-full text-xs p-2 input-dark rounded-lg appearance-none">
                                    <option value="Beginner" ${item.level==='Beginner'?'selected':''}>Beginner</option>
                                    <option value="Intermediate" ${item.level==='Intermediate'?'selected':''}>Intermediate</option>
                                    <option value="Advanced" ${item.level==='Advanced'?'selected':''}>Advanced</option>
                                    <option value="Native" ${item.level==='Native'?'selected':''}>Native</option>
                                </select>
                            </div>
                        </div>`;
                } else if (listName === 'certifications') {
                    innerHTML += `
                        <div class="grid grid-cols-1 gap-2 pr-6 w-full">
                            <div><label class="text-[10px] text-slate-400 font-bold uppercase">Sertifikasi</label><input type="text" value="${item.title}" oninput="updateListItem('certifications', ${item.id}, 'title', this.value)" class="w-full text-xs p-2 input-dark rounded-lg mt-0.5"></div>
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="text-[10px] text-slate-400 font-bold uppercase">Institusi</label><input type="text" value="${item.issuer}" oninput="updateListItem('certifications', ${item.id}, 'issuer', this.value)" class="w-full text-xs p-2 input-dark rounded-lg mt-0.5"></div>
                                <div><label class="text-[10px] text-slate-400 font-bold uppercase">Tahun</label><input type="text" value="${item.year}" oninput="updateListItem('certifications', ${item.id}, 'year', this.value)" class="w-full text-xs p-2 input-dark rounded-lg mt-0.5"></div>
                            </div>
                        </div>`;
                }
                
                div.innerHTML = innerHTML;
                container.appendChild(div);
            });
        }

        function formatDesc(text) {
            if(!text) return '';
            if (text.includes('•') || text.includes('- ')) {
                const items = text.split(/\n|•|- /).filter(i => i.trim() !== '');
                return `<ul class="list-disc pl-4 text-sm mt-1 space-y-1">` + items.map(i => `<li>${i.trim()}</li>`).join('') + `</ul>`;
            }
            return `<p class="text-sm mt-1 whitespace-pre-line">${text}</p>`;
        }

        const templateModern = (data) => `
            <div class="cv-template flex bg-white text-gray-800" style="font-family: var(--font-main);">
                <div class="w-[35%] text-white p-8" style="background-color: var(--color-primary)">
                    ${data.personal.photo ? `<div class="mb-6 flex justify-center"><img src="${data.personal.photo}" class="w-32 h-32 rounded-full border-4 border-white/30 object-cover shadow-sm"></div>` : ''}
                    <div class="mb-8">
                        <h3 class="text-lg font-bold border-b border-white/30 pb-2 mb-3 uppercase tracking-wider text-white">Kontak</h3>
                        <div class="space-y-3 text-sm text-white/90">
                            ${data.personal.phone ? `<div class="flex items-center gap-3"><i class="fa-solid fa-phone w-4 text-center"></i> <span>${data.personal.phone}</span></div>` : ''}
                            ${data.personal.email ? `<div class="flex items-center gap-3"><i class="fa-solid fa-envelope w-4 text-center"></i> <span class="break-all">${data.personal.email}</span></div>` : ''}
                            ${data.personal.location ? `<div class="flex items-center gap-3"><i class="fa-solid fa-location-dot w-4 text-center"></i> <span>${data.personal.location}</span></div>` : ''}
                        </div>
                    </div>
                    ${data.skills.length > 0 ? `
                    <div class="mb-8">
                        <h3 class="text-lg font-bold border-b border-white/30 pb-2 mb-3 uppercase tracking-wider text-white">Skill</h3>
                        <div class="space-y-3">
                            ${data.skills.map(s => `<div><div class="flex justify-between text-sm mb-1 font-medium text-white"><span>${s.name}</span></div><div class="w-full bg-black/20 rounded-full h-1.5 overflow-hidden"><div class="bg-white h-full rounded-full" style="width: ${s.level}%"></div></div></div>`).join('')}
                        </div>
                    </div>` : ''}
                </div>
                <div class="w-[65%] p-8 bg-white text-gray-800">
                    <div class="mb-8 pt-4">
                        <h1 class="text-4xl font-extrabold text-gray-900 uppercase tracking-tight mb-2 leading-none">${data.personal.name || 'NAMA ANDA'}</h1>
                        <h2 class="text-xl font-medium tracking-widest uppercase mt-2" style="color: var(--color-primary);">${data.personal.title || 'Posisi'}</h2>
                        ${data.personal.summary ? `<p class="mt-5 text-sm text-gray-600 leading-relaxed text-justify">${data.personal.summary}</p>` : ''}
                    </div>
                    ${data.experience.length > 0 ? `
                    <div class="mb-8">
                        <h3 class="text-lg font-bold border-b-2 border-gray-100 pb-2 mb-4 uppercase tracking-wider flex items-center gap-2" style="color: var(--color-primary);"><i class="fa-solid fa-briefcase"></i> Pengalaman</h3>
                        <div class="space-y-5">
                            ${data.experience.map(e => `<div class="relative pl-4 border-l-2 border-gray-200"><div class="absolute w-2.5 h-2.5 rounded-full -left-[6px] top-1.5 border border-white" style="background-color: var(--color-primary);"></div><h4 class="font-bold text-gray-800 text-base leading-snug">${e.position}</h4><div class="flex justify-between text-sm text-gray-500 mb-1 font-medium mt-0.5"><span>${e.company}</span><span class="text-gray-400">${e.startDate} - ${e.endDate}</span></div><div class="text-gray-600">${formatDesc(e.description)}</div></div>`).join('')}
                        </div>
                    </div>` : ''}
                </div>
            </div>`;

        const templateATS = (data) => `<div class="cv-template bg-white text-black p-12 font-serif max-w-full" style="font-family: 'Times New Roman', Times, serif; line-height: 1.5;"><div class="text-center mb-6"><h1 class="text-2xl font-bold uppercase mb-2" style="color: black !important;">${data.personal.name || 'NAMA LENGKAP'}</h1><div class="text-sm">${[data.personal.location, data.personal.phone, data.personal.email].filter(Boolean).join(' | ')}</div></div>${data.personal.summary ? `<div class="mb-5"><h2 class="text-sm font-bold uppercase border-b border-black mb-2 pb-1" style="color: black !important;">Ringkasan Profesional</h2><p class="text-sm text-justify">${data.personal.summary}</p></div>` : ''}${data.experience.length > 0 ? `<div class="mb-5"><h2 class="text-sm font-bold uppercase border-b border-black mb-2 pb-1" style="color: black !important;">Pengalaman Kerja</h2>${data.experience.map(e => `<div class="mb-3"><div class="flex justify-between font-bold text-sm"><span>${e.position}, ${e.company}</span><span>${e.startDate} - ${e.endDate}</span></div><div class="text-sm mt-1 ml-4">${formatDesc(e.description)}</div></div>`).join('')}</div>` : ''}</div>`;
        const templateMinimalist = (data) => templateModern(data).replace('w-[35%] text-white p-8', 'w-[35%] bg-gray-100 text-gray-800 p-8').replace(/text-white/g, 'text-gray-800').replace(/bg-black\/20/g, 'bg-gray-300').replace(/bg-white/g, 'bg-primary');
        const templateCreative = (data) => templateModern(data).replace('style="background-color: var(--color-primary)"', 'style="background: linear-gradient(145deg, var(--color-primary), #020617)"');
        const templateClassic = (data) => templateModern(data).replace('font-family: var(--font-main);', "font-family: 'Lora', serif;");

        function renderPreview() {
            const container = document.getElementById('preview-content');
            const tpl = cvState.settings.template;
            
            if (tpl === 'ats') container.innerHTML = templateATS(cvState);
            else if (tpl === 'minimalist') container.innerHTML = templateMinimalist(cvState);
            else if (tpl === 'creative') container.innerHTML = templateCreative(cvState);
            else if (tpl === 'classic') container.innerHTML = templateClassic(cvState);
            else container.innerHTML = templateModern(cvState);
            
            setTimeout(adjustPreviewScale, 50);
        }

        async function exportCV(format) {
            const element = document.getElementById('preview-content');
            const fileName = `CV_${cvState.personal.name.replace(/\s+/g, '_') || 'Resume'}`;
            showToast(`Menyiapkan ${format.toUpperCase()}...`, 'info');

            try {
                if (format === 'pdf') {
                    const origTransform = element.style.transform;
                    element.style.transform = 'scale(1)';
                    const opt = { margin: 0, filename: `${fileName}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true, letterRendering: true, windowWidth: 794 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
                    await html2pdf().set(opt).from(element).save();
                    element.style.transform = origTransform;
                    showToast('PDF diunduh', 'success');
                } 
                else if (format === 'png') {
                    const origTransform = element.style.transform;
                    element.style.transform = 'scale(1)';
                    const canvas = await html2canvas(element, { scale: 2, useCORS: true });
                    canvas.toBlob(blob => { saveAs(blob, `${fileName}.png`); element.style.transform = origTransform; showToast('Gambar diunduh', 'success'); });
                }
            } catch (error) {
                console.error("Export Error:", error);
                showToast(`Gagal export.`, 'error');
            }
        }
    </script>
</body>
</html>
